            - uuid: 318b2444de4647bd883b7041d24a7c4c
              name: 'HDD [{#HDD_NAME}] Power On Days'
              type: DEPENDENT
              key: 'hikvision.hdd.powerondays[{#HDD_ID}]'
              value_type: TEXT
              description: 'Время безотказной работы жесткого диска Hikvision по результатам SMART-тестирования'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.powerOnDay
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var totalDays = parseInt(value);
                      
                      var years  = Math.floor(totalDays / 365);
                      var remain = totalDays % 365;
                      var months = Math.floor(remain / 30);
                      var days   = remain % 30;
                      
                      var parts = [];
                      
                      if (years > 0) {
                          if (years === 1) {
                              parts.push(years + ' год');
                          } else if (years >= 2 && years <= 4) {
                              parts.push(years + ' года');
                          } else {
                              parts.push(years + ' лет');
                          }
                      }
                      
                      if (months > 0) {
                          if (months === 1) {
                              parts.push(months + ' месяц');
                          } else if (months >= 2 && months <= 4) {
                              parts.push(months + ' месяца');
                          } else {
                              parts.push(months + ' месяцев');
                          }
                      }
                      
                      if (days > 0 || parts.length === 0) {
                          if (days === 1 || days === 21) {
                              parts.push(days + ' день');
                          } else if ((days >= 2 && days <= 4) || (days >= 22 && days <= 24)) {
                              parts.push(days + ' дня');
                          } else {
                              parts.push(days + ' дней');
                          }
                      }
                      
                      return parts.join(', ');
              master_item:
