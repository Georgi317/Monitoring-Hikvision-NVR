        - uuid: 8288adac36974a7a8846b2e408dbe194
          name: 'Streaming Channel Discovery'
          type: DEPENDENT
          key: hikvision.streaming.discovery
          item_prototypes:
            - uuid: 714481a185f540b6885a8ef783995611
              name: 'Camera [{#CHANNEL.NUM}] {#STREAM.TYPE}: Bitrate (Kbps)'
              type: DEPENDENT
              key: 'hikvision.stream.bitrate[{#STREAM.ID}]'
              trends: '0'
              preprocessing:
                - type: XML_TO_JSON
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var data = JSON.parse(value);
                      var channels = data.StreamingChannelList.StreamingChannel;
                      var streamId = '{#STREAM.ID}';
                      
                      if (!Array.isArray(channels)) {
                          channels = [channels];
                      }
                      
                      for (var i = 0; i < channels.length; i++) {
                          if (channels[i].id.toString() === streamId) {
                              var video = channels[i].Video;
                              if (!video) return '0';
                              
                              // Если VBR — берём vbrUpperCap, если CBR — constantBitRate
                              var qcType = video.videoQualityControlType || '';
                              
                              if (qcType.toUpperCase() === 'VBR' && video.vbrUpperCap) {
                                  return video.vbrUpperCap.toString();
                              } else if (video.constantBitRate) {
                                  return video.constantBitRate.toString();
                              } else if (video.vbrUpperCap) {
                                  return video.vbrUpperCap.toString();
                              }
                              
                              return '0';
                          }
                      }
                      
                      return '0';
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: hikvision.streaming.raw
              tags:
                - tag: camera
                  value: Bitrate
              trigger_prototypes:
                - uuid: 5907d7a7cc534252accdd6716bcdbc85
                  expression: 'last(/Hikvision By SNMP and API V2/hikvision.stream.bitrate[{#STREAM.ID}])<1080 and "{#STREAM.TYPE}"="mainstream"'
                  name: 'Camera [{#CHANNEL.NUM}] mainstream: bitrate is not 1080 Kbps (currently {ITEM.LASTVALUE})'
                  event_name: 'Битрейт основного потока камеры {#CHANNEL.NUM} равен {ITEM.LASTVALUE} вместо 1080 Kbps'
                  priority: HIGH
                  description: 'Битрейт основного потока камеры {#CHANNEL.NUM} равен {ITEM.LASTVALUE} вместо 1080 Kbps'
                - uuid: dc971efffb3a48b185252b17868147db
                  expression: 'last(/Hikvision By SNMP and API V2/hikvision.stream.bitrate[{#STREAM.ID}])<>750 and "{#STREAM.TYPE}"="substream"'
                  name: 'Camera [{#CHANNEL.NUM}] substream: bitrate is not 750 Kbps (currently {ITEM.LASTVALUE})'
                  event_name: 'Битрейт дополнительного потока камеры {#CHANNEL.NUM} равен {ITEM.LASTVALUE} вместо 750 Kbps'
                  priority: HIGH
                  description: 'Битрейт дополнительного потока камеры {#CHANNEL.NUM} равен {ITEM.LASTVALUE} вместо 512 Kbps'
            - uuid: 32bc83bf330a4651967010ce5a69cf41
              name: 'Camera [{#CHANNEL.NUM}] {#STREAM.TYPE}: Video Codec'
              type: DEPENDENT
              key: 'hikvision.stream.codec[{#STREAM.ID}]'
              value_type: CHAR
              preprocessing:
                - type: XML_TO_JSON
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var data = JSON.parse(value);
                      var channels = data.StreamingChannelList.StreamingChannel;
                      var streamId = '{#STREAM.ID}';
                      
                      if (!Array.isArray(channels)) channels = [channels];
                      
                      for (var i = 0; i < channels.length; i++) {
                          if (channels[i].id.toString() === streamId) {
                              var video = channels[i].Video;
                              if (video && video.videoCodecType) {
                                  return video.videoCodecType.toString();
                              }
                          }
                      }
                      return 'N/A';
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
