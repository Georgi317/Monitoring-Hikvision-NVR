            - uuid: cabc1fe25b224ac3a8b220e8b367d4dc
              name: 'Camera [{#CHANNEL.NUM}] {#STREAM.TYPE}: Frame Rate'
              type: DEPENDENT
              key: 'hikvision.stream.framerate[{#STREAM.ID}]'
              value_type: FLOAT
              trends: '0'
              preprocessing:
                - type: XML_TO_JSON
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var data = JSON.parse(value);
                      var channels = data.StreamingChannelList.StreamingChannel;
                      var streamId = '{#STREAM.ID}';
                      
                      if (!Array.isArray(channels)) channels = [channels];
                      
                      for (var i = 0; i < channels.length; i++) {
                          if (channels[i].id.toString() === streamId) {
                              var video = channels[i].Video;
                              if (video && video.maxFrameRate) {
                                  // Hikvision отдаёт fps * 100, т.е. 2500 = 25 fps
                                  return (parseInt(video.maxFrameRate) / 100).toString();
                              }
                          }
                      }
                      return '0';
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
