                  value: Codec
              trigger_prototypes:
                - uuid: ec84412cbc8740cf883ad7b5847c4a0b
                  expression: 'last(/Hikvision By SNMP and API V2/hikvision.stream.codec[{#STREAM.ID}])<>"H.265" and "{#STREAM.TYPE}"="mainstream"'
                  name: 'Camera [{#CHANNEL.NUM}] mainstream: codec is not H.265 (currently {ITEM.LASTVALUE})'
                  event_name: 'Основной поток камеры {#CHANNEL.NUM} использует кодек {ITEM.LASTVALUE} вместо H.265'
                  priority: HIGH
                  description: 'Основной поток камеры {#CHANNEL.NUM} использует кодек {ITEM.LASTVALUE} вместо H.265'
