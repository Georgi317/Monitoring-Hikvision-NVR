                  expression: 'last(/Hikvision By SNMP and API V2/hikvision.stream.framerate[{#STREAM.ID}])<{$HIKVISION.MIN.FPS}'
                  name: 'Camera [{#CHANNEL.NUM}] {#STREAM.TYPE}: frame rate below {$HIKVISION.MIN.FPS} fps ({ITEM.LASTVALUE})'
                  priority: HIGH
            - uuid: e61f632c7cb346e7ad3cb57ce50656f4
              name: 'Camera [{#CHANNEL.NUM}] {#STREAM.TYPE}: Quality Control Type'
              type: DEPENDENT
              key: 'hikvision.stream.qctype[{#STREAM.ID}]'
              value_type: CHAR
              preprocessing:
                - type: XML_TO_JSON
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var data = JSON.parse(value);
                      var channels = data.StreamingChannelList.StreamingChannel;
                      var streamId = '{#STREAM.ID}';
                      
                      if (!Array.isArray(channels)) channels = [channels];
                      
                      for (var i = 0; i < channels.length; i++) {
                          if (channels[i].id.toString() === streamId) {
                              var video = channels[i].Video;
                              if (video && video.videoQualityControlType) {
                                  return video.videoQualityControlType.toString();
                              }
                          }
                      }
                      return 'N/A';
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: hikvision.streaming.raw
              tags:
                - tag: camera
                  value: 'Quality Control Type'
            - uuid: b8d5c5ab61c346e3ad858b7b88953348
              name: 'Camera [{#CHANNEL.NUM}] {#STREAM.TYPE}: Resolution'
              type: DEPENDENT
              key: 'hikvision.stream.resolution[{#STREAM.ID}]'
              value_type: CHAR
              preprocessing:
                - type: XML_TO_JSON
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var data = JSON.parse(value);
                      var channels = data.StreamingChannelList.StreamingChannel;
                      var streamId = '{#STREAM.ID}';
                      
                      if (!Array.isArray(channels)) channels = [channels];
                      
                      for (var i = 0; i < channels.length; i++) {
                          if (channels[i].id.toString() === streamId) {
                              var v = channels[i].Video;
                              if (v && v.videoResolutionWidth && v.videoResolutionHeight) {
                                  return v.videoResolutionWidth + 'x' + v.videoResolutionHeight;
                              }
                          }
                      }
                      return 'N/A';
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: hikvision.streaming.raw
              tags:
                - tag: camera
                  value: Resolution
          master_item:
            key: hikvision.streaming.raw
          preprocessing:
            - type: XML_TO_JSON
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var channels = data.StreamingChannelList.StreamingChannel;
                  var result = [];
                  
                  if (!Array.isArray(channels)) {
                      channels = [channels];
                  }
                  
                  for (var i = 0; i < channels.length; i++) {
                      var ch = channels[i];
                      var streamId = ch.id.toString();
                      
                      // Определяем номер камеры и тип потока
                      // ID формат: {camera}0{stream} → 101=cam1/main, 102=cam1/sub, 201=cam2/main...
                      var channelNum = Math.floor(parseInt(streamId) / 100);
                      var streamNum = parseInt(streamId) % 100;
                      
                      var streamType;
                      if (streamNum === 1) {
                          streamType = "mainstream";
                      } else if (streamNum === 2) {
                          streamType = "substream";
                      } else {
                          streamType = "stream" + streamNum;
                      }
                      
                      // Пропускаем потоки 3+ если не нужны
                      if (streamNum > 2) continue;
                  
                      result.push({
                          "{#STREAM.ID}":     streamId,
                          "{#CHANNEL.NUM}":   channelNum.toString(),
                          "{#STREAM.NUM}":    streamNum.toString(),
                          "{#STREAM.TYPE}":   streamType
                      });
                  }
                  
                  return JSON.stringify(result);
